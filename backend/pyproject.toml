[project]
name = "meal-prep-backend"
version = "0.1.0"
description = "FastAPI backend for Meal Prep Agent"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.14.0",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.165.0",
    "httpx>=0.28.1",
    "ortools>=9.15.6755",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.9",
    "supabase>=2.34.1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
